networks:
  radares-net:
    external: true

services:
  # ===============================================================
  # NOSSO MICROSSERVIÇO: Radar Eixo
  # ===============================================================
  microservico-radar-eixo:
    container_name: microservico-radares-eixo
    # Em vez de 'image', usamos 'build' para construir a partir do nosso Dockerfile
    build:
      context: ../microservico-radares-eixo # Caminho relativo para a pasta do projeto
    ports:
      - "8086:8086" # Expõe a porta do serviço para a sua máquina
    environment:
      # ATIVA O PERFIL DE PRODUÇÃO, fazendo o Spring usar o application-prod.properties
      # --- Configurações do Spring ---
      - SPRING_PROFILES_ACTIVE=prod
      # --- Configurações do SFTP e Pastas ---
      - SFTP_LOCAL_DIRECTORY=/app/downloads
      - SFTP_DOWNLOAD_LIMITE_DIAS=30
      - SFTP_HOST=${EIXO_SFTP_HOST}
      - SFTP_PORT=${EIXO_SFTP_PORT}
      - SFTP_USER=${EIXO_SFTP_USER}
      - SFTP_PASS=${EIXO_SFTP_PASS}
      # --- Banco de Dados ---
      # - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/eixo_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # --- Mensageria (RabbitMQ) ---
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_EXCHANGE_NAME=radares_exchange
      - RABBITMQ_ROUTING_KEY=radares.eixo
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # --- Integração com Config Server e Eureka (Adicione se o seu projeto usar) ---
      #- SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      #- EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    volumes:
      - "/mnt/data/docker-volumes/radares_project/downloads/Eixo:/app/downloads"
    networks:
      - radares-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  postgres-eixo-data:
  pgadmin-data: # <-- Adicionar o novo volume aqui
  es-data: