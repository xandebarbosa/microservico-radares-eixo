server.port=8086

# Configuracoes do Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=microservice-radar-eixo

# ==========================================================
# ##            CONFIGURACAO DO BANCO POSTGRESQL            ##
# ==========================================================
# Aponta para o servico 'postgres-db' que definiremos no Docker Compose
spring.datasource.url=jdbc:postgresql://postgres-db:5432/eixo_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Define a plataforma base do banco de dados
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Define o DIALETO ESPECIAL PostGIS para Hibernate 6 (SEM .spatial no nome)
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostGISDialect

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostGISDialect
# Em producao, o Flyway cuidara disso. 'validate' \u00E9 mais seguro.
spring.jpa.hibernate.ddl-auto=validate

# Adicionado para consistencia com seu arquivo do Config Server
# Habilita o Flyway para gerenciar o banco de dados
spring.flyway.enabled=true

# ==========================================================
# ##            CONFIGURACOES DO RABBITMQ                 ##
# ==========================================================
# Aponta para o servi\u00E7o 'rabbitmq' no Docker Compose
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ Producer Configuration
rabbitmq.exchange.name=radares_exchange
rabbitmq.routing.key=radares.eixo

# ? Query Plan Cache
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# ? Statement Cache
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ? Desabilita logs desnecess\u00E1rios em produ\u00E7\u00E3o
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ? Cache de segundo n\u00EDvel (opcional - use com cautela)
# spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# ============================================
# REDIS OTIMIZADO
# ============================================
spring.data.redis.host=redis-cache
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# ============================================
# TUNING ADICIONAL
# ============================================

# Tamanho do batch para FTP (reduz carga de I/O)
ftp.batch.size=1000

# Intervalo do scheduler (5 minutos)
ftp.schedule.rate.ms=300000

#Habilita Vitural Theads
spring.threads.virtual.enabled=true

# Thread pool para opera\u00E7\u00F5es ass\u00EDncronas
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

##Configura\u00E7\u00E3o do Pool de Conex\u00F5es (HikariCP)
# Define o m\u00E1ximo de conex\u00F5es ativas no pool
spring.datasource.hikari.maximum-pool-size=30
# Mant\u00E9m um m\u00EDnimo de conex\u00F5es prontas para uso
spring.datasource.hikari.minimum-idle=10
# Tempo m\u00E1ximo que uma thread espera por uma conex\u00E3o antes do timeout
spring.datasource.hikari.connection-timeout=20000
# Tempo m\u00E1ximo de vida de uma conex\u00E3o no pool - 600000 (10 min)
spring.datasource.hikari.max-lifetime=600000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ==========================================
# RESILIÊNCIA DO RABBITMQ - CONSUMIDOR (Listener)
# Tenta reconectar e reprocessar se o RabbitMQ cair enquanto lê mensagens
# ==========================================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=5000ms
spring.rabbitmq.listener.simple.retry.max-attempts=10
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# ==========================================
# RESILIÊNCIA DO RABBITMQ - PRODUTOR (Template)
# Evita que a aplicação trave ao tentar enviar uma mensagem se o broker estiver fora
# ==========================================
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=5000ms
spring.rabbitmq.template.retry.max-attempts=10
spring.rabbitmq.template.retry.multiplier=2.0

# ==========================================
# RESILIÊNCIA DO EUREKA (Descoberta de Serviço)
# ==========================================
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=30

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Habilita o monitoramento do estado do Circuit Breaker no Actuator (opcional, mas recomendado)
management.health.circuitbreakers.enabled=true

# Configurações do disjuntor nomeado "sftp-server"
# Tamanho da janela móvel de requisições a ser avaliada
resilience4j.circuitbreaker.instances.sftp-server.sliding-window-size=5
# Se 50% das últimas 5 tentativas falharem, o disjuntor ABRE
resilience4j.circuitbreaker.instances.sftp-server.failure-rate-threshold=50
# Tempo que o sistema vai esperar (sem tentar reconectar) antes de testar novamente
resilience4j.circuitbreaker.instances.sftp-server.wait-duration-in-open-state=5m
# Número de requisições permitidas no estado Half-Open para testar se a rede voltou
resilience4j.circuitbreaker.instances.sftp-server.permitted-number-of-calls-in-half-open-state=2

sftp.pool.size=15