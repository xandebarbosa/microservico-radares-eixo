spring.application.name=microsservico-radar-eixo

#spring.profiles.active=${APP_PROFILE:prod}
spring.profiles.active=prod
#spring.jpa.open-in-view=false

# A aplica\u00E7\u00E3o tentar\u00E1 buscar o config server, se falhar (optional:),
# ela continuar\u00E1 e usar\u00E1 o 'application-prod.properties' local como fallback.
spring.config.import=optional:configserver:http://config-server:8888

cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

sftp.host=${SFTP_HOST}
sftp.port=${SFTP_PORT}
sftp.user=${SFTP_USER}
sftp.pass=${SFTP_PASS}
sftp.local.directory=D:/Radares/Eixo
sftp.remote.directory=/recebidos
sftp.schedule.rate.ms=300000

# CONFIGURA\u00C7\u00C3O DO AGENDADOR (SCHEDULER)
# Define um pool de 5 threads: 1 para o FTP, 4 livres para outras tarefas (como localiza\u00E7\u00E3o)
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=agendador-eixo-